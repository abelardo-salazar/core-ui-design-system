name: Release

# Publishes the package to the public npm registry when a vX.Y.Z tag is pushed. The tag defines what
# gets published: the tagged commit must be on main and its package.json must have version
# X.Y.Z. Release flow: ARCHITECTURE.md § Versiones y tags.
on:
  push:
    tags: ['v*.*.*']

# id-token: write lets npm request a GitHub OIDC token for trusted publishing (no npm token
# is stored in the repo) and sign the provenance attestation.
permissions:
  contents: read
  id-token: write

# Never cancel a release half-way; a second push of the same tag waits for the first run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history so the tagged commit can be checked against main.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check tag against package.json and main
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)."
            exit 1
          fi
          commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $commit, which is not on main."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json and $commit is on main."

      # Node 22 LTS, same as ci.yml. No registry-url: setup-node would write an .npmrc with a
      # placeholder auth token. The default registry is npmjs, npm view runs anonymously (the
      # package is public) and npm publish authenticates through OIDC.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Fails before the long steps if the version is already in the registry. Anonymous: the
      # package is public. E404 means the package doesn't exist on npm, so no version is
      # published. Any other npm view failure (network, registry) fails the job: publishing is
      # never attempted blind.
      - name: Check version is not published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          err="$RUNNER_TEMP/npm-view.err"
          if ! published="$(npm view "$name" versions --json 2> "$err")"; then
            # With --json, npm writes the error code to stdout as JSON and to stderr as a log line.
            if printf '%s\n' "$published" | cat - "$err" | grep -qw 'E404'; then
              echo "$name is not on the registry yet, so $version is not published."
              exit 0
            fi
            printf '%s\n' "$published"
            cat "$err"
            echo "::error::npm view $name failed; not publishing blind."
            exit 1
          fi
          if node -e 'const v = [].concat(JSON.parse(process.argv[1])); process.exit(v.includes(process.argv[2]) ? 0 : 1)' "$published" "$version"; then
            echo "::error::$name@$version is already published. Bump the version in a release PR and tag the new version."
            exit 1
          fi
          echo "$name@$version is not published yet."

      - name: Install dependencies
        run: npm ci

      # Same verification as the verify job in ci.yml; keep both in sync.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --only-shell

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Verify README
        run: npm run verify:readme

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Verify Tailwind consumer
        run: npm run verify:tailwind-consumer

      - name: Test
        run: npm run test

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10. Upgraded only here, so the
      # verification above runs with the same npm as ci.yml.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # Publishes the dist/ built and tested above, with no token: npm exchanges the GitHub OIDC
      # token for a short-lived publish credential, which npmjs only grants to the trusted
      # publisher configured for this package (this repo and release.yml). --provenance attaches
      # a signed attestation that links the tarball to this commit and workflow run.
      # publishConfig in package.json sets the npmjs registry and public access; the registry
      # also rejects a version that already exists.
      - name: Publish
        run: npm publish --provenance
