name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch: when new pushes arrive, the previous run is cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fails only on high/critical vulnerabilities introduced by the PR's own dependency
      # changes. Advisories published later against unchanged dependencies are caught by
      # the weekly audit (audit.yml), so they don't block unrelated PRs. It reads the
      # dependency diff from the GitHub API and needs no install, so it runs first.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      # Node 22 LTS: the repo doesn't declare engines; it's the intersection of the ranges
      # of the installed deps (vitest 4 excludes Node 23, vite 7 requires >=22.12).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The suite runs Vitest in browser mode (Playwright, headless). No --with-deps: the
      # system dependencies come from apt, which once took 12 minutes to download 32 MB
      # (#43, #44), and the runner already has them because Google Chrome is preinstalled. If one
      # is missing, Playwright fails when launching the browser and names it. --only-shell: headless
      # uses Chrome Headless Shell, so Chrome for Testing isn't needed in CI.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # The key follows the version installed from the lockfile: it changes on its own when
      # Playwright is updated.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --only-shell

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # Version badge and line, first CHANGELOG heading and the Server Components table.
      - name: Verify README
        run: npm run verify:readme

      - name: Typecheck
        run: npx tsc -b

      # build already runs scripts/verify-client-directives.mjs as a prestep.
      - name: Build
        run: npm run build

      # Compiles the npm pack tarball in a Tailwind v4 consumer that imports
      # ./tailwind.css. No network: builds the consumer from the tarball and node_modules.
      - name: Verify Tailwind consumer
        run: npm run verify:tailwind-consumer

      # Every font url() of the published fonts.css and style.css points to a file of the
      # tarball, neither mentions Google Fonts, and a Tailwind consumer resolves them.
      - name: Verify fonts
        run: npm run verify:fonts

      - name: Test
        run: npm run test

      # Only here, not in release.yml: a docs failure must not block publishing the package.
      - name: Build Storybook
        run: npm run build-storybook
