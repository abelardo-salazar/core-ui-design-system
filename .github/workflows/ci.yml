name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Un solo run por rama: si llegan pushes nuevos, se cancela el anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22 LTS: el repo no declara engines; es la intersección de los rangos
      # de las deps instaladas (vitest 4 excluye Node 23, vite 7 pide >=22.12).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # El runner no trae navegador; la suite corre Vitest en modo browser (Playwright).
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      # build ya incluye scripts/verify-client-directives.mjs como prestep.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Falla solo ante vulnerabilidades high/critical; moderate/low no bloquean.
      - name: Audit
        run: npm audit --audit-level=high
