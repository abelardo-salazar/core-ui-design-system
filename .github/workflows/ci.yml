name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Un solo run por rama: si llegan pushes nuevos, se cancela el anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22 LTS: el repo no declara engines; es la intersección de los rangos
      # de las deps instaladas (vitest 4 excluye Node 23, vite 7 pide >=22.12).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # La suite corre Vitest en modo browser (Playwright, headless). Sin --with-deps: las
      # dependencias del sistema salen de apt, que llegó a tardar 12 minutos en bajar 32 MB
      # (#43, #44), y el runner ya las trae por tener Google Chrome preinstalado. Si alguna
      # falta, Playwright falla al lanzar el navegador y la nombra. --only-shell: headless
      # usa Chrome Headless Shell, así que Chrome for Testing no hace falta en CI.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # La clave sigue la versión instalada desde el lockfile: cambia sola al actualizar
      # Playwright.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --only-shell

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npx tsc -b

      # build ya incluye scripts/verify-client-directives.mjs como prestep.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Falla solo ante vulnerabilidades high/critical; moderate/low no bloquean.
      - name: Audit
        run: npm audit --audit-level=high
