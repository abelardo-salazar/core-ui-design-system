version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates only: 0 disables version updates. Security updates still use
    # commit-message and the security-updates groups below.
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      prefix-development: chore
    groups:
      storybook:
        applies-to: security-updates
        patterns:
          - 'storybook'
          - '@storybook/*'
          - 'eslint-plugin-storybook'
      vitest:
        applies-to: security-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
